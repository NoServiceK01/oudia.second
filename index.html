<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>列車位置表示</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9fbfa;--panel:#fff;--band:#ecf0f3;--ink:#2b3840;--mute:#6c7b83;--car:#627d8c;--line:#b8c4c9;--rule:#dde4e7;--acc:#3f7f22;--accf:#fff;--lc:#5a9e35;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11191d;--panel:#1a252a;--band:#202e34;--ink:#e4edf0;--mute:#8da0a6;--car:#8aa5b3;--line:#52666d;--rule:#2a3a40;--acc:#8fd16a;--accf:#10200a;--lc:#78b552}}
:root[data-theme="dark"]{--bg:#11191d;--panel:#1a252a;--band:#202e34;--ink:#e4edf0;--mute:#8da0a6;--car:#8aa5b3;--line:#52666d;--rule:#2a3a40;--acc:#8fd16a;--accf:#10200a;--lc:#78b552}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--rule);padding:10px 14px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
#sb .row{flex-wrap:wrap}
button,select,.btn,input[type=time]{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
select{padding-right:6px}
.ib{width:40px;padding:0}
.pri,.seg button.on{background:var(--acc);color:var(--accf);border-color:var(--acc)}
.seg{display:inline-flex;flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-width:0;border:0;border-radius:0;min-height:38px;padding:0 4px;background:var(--bg);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;gap:6px;flex:none}
button:focus-visible,select:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:5.6ch}
input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4}
#drop{margin:40px 14px;padding:48px 20px;border:2px dashed var(--line);border-radius:10px;text-align:center;color:var(--mute)}
#drop.over{border-color:var(--acc);color:var(--ink)}
#drop b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
main{padding:0 0 110px}
#mn .wrap{max-width:none;overflow-x:auto}
input[type=time]{font-size:20px;font-weight:700;width:7.8em;font-variant-numeric:tabular-nums;cursor:text}
.ic{display:inline-block;width:20px;height:20px;border-radius:5px;text-align:center;font-size:12px;font-weight:700;line-height:20px;vertical-align:-3px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
#map{display:block;width:100%;height:auto;max-width:480px;margin:0 auto}
svg{flex:none}
.ib svg{width:20px;height:20px;display:block}
#shp button{flex-direction:column;gap:2px;padding:6px 4px;min-height:64px;white-space:nowrap}
#shp svg{width:26px;height:30px;display:block}
.nm{font-size:17px;font-weight:700;fill:var(--ink)}
.nm.sub{font-size:15px}
#info{position:fixed;left:0;right:0;bottom:0;background:var(--band);border-top:1px solid var(--rule);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
#info .wrap{min-height:30px}
#note{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
#note:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mute)}
.ln{margin-bottom:4px}
.mute{color:var(--mute)}
.hide{display:none!important}
.sw{width:32px;height:32px;min-height:0;border-radius:50%;padding:0;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
#lcs input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--rule);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-height:72vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule)}
#sb{overflow:auto;padding:4px 14px 16px}
table{border-collapse:collapse;width:100%}
td,th{padding:6px;border-bottom:1px solid var(--rule);text-align:left;font-variant-numeric:tabular-nums;vertical-align:top}
th{font-weight:400;color:var(--mute);font-size:12px}
tr.past{opacity:.4}tr.now{background:var(--band);font-weight:700}tr.next{box-shadow:inset 3px 0 0 var(--lc)}
.hr{width:2.3em;font-weight:700;font-size:22px}
.m{display:inline-flex;flex-direction:column;align-items:center;margin:0 12px 10px 0;line-height:1.15}.m b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.m small{font-size:11px;color:var(--mute);white-space:nowrap}
h3{margin:14px 0 4px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1 id="ttl">列車位置表示</h1>
      <span class="acts"><button class="ib" id="gear" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.6"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></g></svg></button><button class="ib" id="thm" aria-label="ライト/ダークを切り替え" title="ライト/ダーク"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button><label class="btn" tabindex="0" title="ファイルを開く">開く<input id="file" type="file" accept=".oud2,.oud" hidden></label></span>
    </div>
    <div id="ctl" class="hide">
      <div class="row"><select id="dia" aria-label="ダイヤ" style="flex:1;min-width:0"></select><input id="tin" type="time" step="1" aria-label="時刻(直接入力)"></div>
      <div class="row"><button id="play" class="ib pri" aria-label="再生・停止"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg></button>
        <div class="seg" id="spd" role="group" aria-label="進む速さ"><button data-v="1">×1</button><button data-v="10">×10</button><button data-v="30">×30</button><button data-v="60" class="on">×60</button><button data-v="300">×300</button></div>
        <button id="now">いま</button></div>
    </div>
  </div>
</header>
<div id="drop"><b>oud2ファイルをここにドロップ</b>またはボタンから選択してください(OuDiaSecond形式)</div>
<main class="hide" id="mn"><div class="wrap"><svg id="map" role="img" aria-label="路線図"><g id="base"></g><g id="stp" style="pointer-events:none"></g><g id="trains"></g></svg></div></main>
<div id="sheet" class="hide"><div id="sh"></div><div id="sb"></div></div>
<div id="info" class="hide"><div class="wrap"><div id="inf"></div><div id="note">時刻表に基づく計算上の位置です。実際の運行とは異なる場合があります</div></div></div>
<script>
const $=s=>document.querySelector(s);
let LX=[170,330];const X=l=>LX[l]??LX[LX.length-1], Y=r=>60+r*176, BC=["#d98c00","#2f8fd0","#a14fb8"];
let M=null,T=0,playing=true,speed=60,selIds=new Set(),hidden=new Set(),hideTT=new Set(),cur=[],lastHtml='';

function parseOud(t){const root={},stack=[root];for(const l of t.split('\n')){const c=stack[stack.length-1];if(l==='.'){if(stack.length>1)stack.pop();continue}const q=l.indexOf('=');if(q<0){if(l.endsWith('.')){const o={};(c[l.slice(0,-1)]??=[]).push(o);stack.push(o)}continue}c[l.slice(0,q)]=l.slice(q+1)}return root}
const tm=s=>{if(!s)return null;s=s.trim();if(!/^\d{3,6}$/.test(s))return null;const L=s.length;if(L<=4)return +s.slice(0,L-2)*3600+ +s.slice(-2)*60;return +s.slice(0,L-4)*3600+ +s.slice(-4,-2)*60+ +s.slice(-2)};
const fmt=(t,s)=>{t=Math.floor(t)%86400;return String(t/3600|0).padStart(2,'0')+':'+String(t%3600/60|0).padStart(2,'0')+(s?':'+String(t%60).padStart(2,'0'):'')};
// OuDiaの色は BBGGRR 順
const col=c=>{c=(c||'00000000').slice(-6);const h='#'+c.slice(4,6)+c.slice(2,4)+c.slice(0,2);return h==='#000000'?'var(--ink)':h};

function setup(root,name){
  const R=root.Rosen[0];
  const st=R.Eki.map((e,i)=>({name:e.Ekimei,major:e.Ekikibo==='Ekikibo_Syuyou',core:e.BrunchCoreEkiIndex!=null?+e.BrunchCoreEkiIndex:null,tracks:e.EkiTrack2Cont?.[0]?.EkiTrack2||[]}));
  // --- 駅の接続関係を作る ---
  // BrunchCoreEkiIndex を持つ駅は、指された駅と同じ駅(分岐駅)。駅リストの隣同士は基本的につながるが、
  // 分岐駅とその相手の間にある側の隣接だけは、実際の線路ではないので外す
  const n=st.length,par=st.map((_,i)=>i),find=x=>par[x]===x?x:(par[x]=find(par[x]));
  const cut=new Set();
  st.forEach((e,i)=>{if(e.core==null||e.core<0||e.core>=n)return;const a=find(i),b=find(e.core);if(a<b)par[b]=a;else par[a]=b;cut.add(i<e.core?i+'_'+(i+1):(i-1)+'_'+i)});
  const cn=i=>find(i),adj=new Map();
  st.forEach((_,i)=>{if(cn(i)===i)adj.set(i,new Set())});
  const fwd=new Set();
  for(let i=0;i<n-1;i++){if(cut.has(i+'_'+(i+1)))continue;const u=cn(i),v=cn(i+1);if(u!==v){adj.get(u).add(v);adj.get(v).add(u);fwd.add(u+'>'+v)}}
  // fwd: 下り列車がu→vへ進む向き。本線は下り向きに一方通行で最も長くたどれる経路にする
  const dn=(u,x)=>fwd.has(u+'>'+x),pos=[],lanes=[],conn=[],node={};let rows=0,maxLane=1;
  const longest=(u,up,vis=new Set([u]))=>{let best=[];for(const x of adj.get(u)){if(node[x]||vis.has(x)||!(up?dn(x,u):dn(u,x)))continue;vis.add(x);const p=longest(x,up,vis);if(p.length>best.length)best=p}return [u,...best]};
  for(;;){
    let main=[];for(const u of adj.keys())if(!node[u]){const p=longest(u,false);if(p.length>main.length)main=p}
    if(!main.length)break;
    const comp=[],cs=[];lanes.length=0;
    main.forEach((u,i)=>{node[u]={lane:0,row:i};comp.push(u)});
    const todo=[...main];
    while(todo.length){const v=todo.shift(),pv=node[v];
      for(const w of adj.get(v)){if(node[w])continue;
        // 下り列車が分岐線から駅へ入ってくる(合流)なら分岐線は駅の上側、駅から出ていくなら下側に伸ばす
        const up=dn(w,v)&&!dn(v,w),P=longest(w,up),r0=pv.row,len=P.length,lo=up?r0-len:r0+1,hi=up?r0-1:r0+len;
        let lane=1;while(lane===pv.lane||(lanes[lane]&&lanes[lane].some(([x,y])=>!(hi<x||lo>y))))lane++;
        (lanes[lane]??=[]).push([lo,hi]);maxLane=Math.max(maxLane,lane);
        P.forEach((u,k)=>{node[u]={lane,row:up?r0-1-k:r0+1+k};comp.push(u);todo.push(u)});
        const c={from:pv,lane,top:lo,bot:hi,up,end:P[len-1]};conn.push(c);cs.push(c)}}
    const rs=comp.map(u=>node[u].row),mn=Math.min(...rs),mx=Math.max(...rs),sh=rows-mn;
    comp.forEach(u=>node[u].row+=sh);cs.forEach(c=>{c.top+=sh;c.bot+=sh});rows+=mx-mn+1;
  }
  st.forEach((_,i)=>{pos[i]={...node[cn(i)],copy:cn(i)!==i,id:cn(i)}});
    const types=(R.Ressyasyubetsu||[]).map(t=>({name:t.Syubetsumei,ini:[...(t.Ryakusyou||t.Syubetsumei||'?')][0],col:col(t.DiagramSenColor||t.JikokuhyouMojiColor)}));
  M={st,pos,conn,rows,maxLane,types,dias:(R.Dia||[]).map(d=>({name:d.DiaName||'ダイヤ',d,trains:null})),name:name||R.Rosenmei||''};
  // --- 駅名・停車種別の文字幅から各レーンの位置と全体の幅を決める(駅名と列車アイコンが重ならないように) ---
  // 本線(レーン0)の文字は線の左側、分岐レーンの文字は線の右側。列車アイコンは線から26pxの位置で、
  // 同じ駅に列車が重なって寄る場合は34pxさらに外側(合計で約78pxまで)に出る
  M.dias.forEach(d=>{if(!d.trains)d.trains=build(d);d.stops=stopMap(d)});
  const wl=[];
  st.forEach((e,i)=>{const p=pos[i];if(p.copy)return;let nc=0;for(const d of M.dias)nc=Math.max(nc,(d.stops.get(pk(i))||new Set()).size);
    const fs=p.lane?15:17,nw=[...e.name].reduce((a,c)=>a+(c.charCodeAt(0)>255?1:.58)*fs,0);wl[p.lane]=Math.max(wl[p.lane]||0,nw,nc*19)});
  LX=[12+(wl[0]||0)+6+78];LX[1]=LX[0]+162;
  for(let l=2;l<=maxLane;l++)LX[l]=LX[l-1]+82+(wl[l-1]||0)+8+78;
  const W=Math.ceil(Math.max(480,LX[Math.max(1,maxLane)]+82+(wl[Math.max(1,maxLane)]||0)+12));
  // 路線図(静的部分)
  let h='';
  for(let r=0;r<rows;r++)h+=`<rect x="0" y="${Y(r)-26}" width="${W}" height="52" fill="var(--band)"/>`;
  // 本線(レーン0)の線
  const l0=Object.values(node).filter(p=>p.lane===0).map(p=>p.row);
  if(l0.length)h+=`<line x1="${X(0)}" y1="${Y(Math.min(...l0))-40}" x2="${X(0)}" y2="${Y(Math.max(...l0))}" stroke="var(--lc)" stroke-width="9" stroke-linecap="round"/>`;
  // 分岐線は駅と駅の間でカーブを描いて本線から分かれる
  for(const c of conn){const f=c.from,R=26,x0=X(f.lane),x1=X(c.lane),mx=(x0+x1)/2,sg=Math.sign(x1-x0)||1;let d,hy;
    if(!c.up){const yA=Y(f.row)+56;hy=yA+R;d=`M${x0} ${yA}Q${x0} ${hy} ${x0+sg*R} ${hy}H${x1-sg*R}Q${x1} ${hy} ${x1} ${yA+2*R}V${Y(c.bot)}`}
    else{const yJ=Y(f.row)-56;hy=yJ-R;d=`M${x1} ${Y(c.top)}V${yJ-2*R}Q${x1} ${hy} ${x1-sg*R} ${hy}H${x0+sg*R}Q${x0} ${hy} ${x0} ${yJ}`}
    h+=`<path d="${d}" fill="none" stroke="var(--lc)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`;
    const nm=st[c.end].name+'方面',w=nm.length*14+28;
    h+=`<rect x="${mx-w/2}" y="${hy-40}" width="${w}" height="28" rx="14" fill="var(--panel)" stroke="var(--line)"/><text x="${mx}" y="${hy-21}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${nm}</text>`}
  st.forEach((s,i)=>{const p=pos[i];if(p.copy)return;const x=X(p.lane),y=Y(p.row);
    h+=`<g data-st="${i}" style="cursor:pointer"><rect x="${p.lane?x-16:0}" y="${y-26}" width="${p.lane?W-x+16:x+16}" height="52" fill="transparent"/><circle cx="${x}" cy="${y}" r="${s.major?9:7.5}" fill="var(--panel)" stroke="var(--lc)" stroke-width="5"/>`;
    h+=p.lane===0?`<text class="nm" x="12" y="${y-2}">${s.name}</text></g>`:`<text class="nm sub" x="${x+82}" y="${y-2}">${s.name}</text></g>`});
  const H=Y(rows)+10;$('#map').setAttribute('viewBox',`0 0 ${W} ${H}`);$('#map').style.maxWidth=W+'px';$('#map').style.minWidth=(maxLane>1||W>520)?W+'px':'';$('#base').innerHTML=h;
  // UI
  $('#ttl').textContent=M.name||'列車位置表示';
  $('#dia').innerHTML=M.dias.map((d,i)=>`<option value="${i}">${d.name}</option>`).join('');
  hidden.clear();hideTT.clear();selIds=new Set();
  for(const el of ['#drop'])$(el).classList.add('hide');
  for(const el of ['#ctl','#mn','#info'])$(el).classList.remove('hide');
  useDia(0,true);
}

function build(d){
  const n=M.st.length,out=[];
  for(const [sec,dir] of [['Kudari',0],['Nobori',1]])for(const r of (d.d[sec]?.[0]?.Ressya||[])){
    const route=[];
    (r.EkiJikoku||'').split(',').forEach((e,j)=>{
      if(!e)return;const m=e.match(/^(\d)(?:;([^$]*))?/);if(!m)return;const ty=+m[1];if(ty!==1&&ty!==2)return;
      // 上り列車の時刻は駅順が逆(末尾が最初の駅)で記録されている
      const s=dir?n-1-j:j;let a=null,dd=null;
      if(m[2]!=null){const p=m[2].split('/');a=tm(p[0]);dd=tm(p[1]);if(a==null)a=dd;if(dd==null)dd=a}
      route.push({s,a,d:dd,ps:ty===2,tk:(e.match(/\$(\d+)/)||[])[1]});
    });
    const si=[];route.forEach((x,i)=>{if(x.a!=null)si.push(i)});
    const stp=si.filter(i=>!route[i].ps);if(stp.length<2)continue;
    let off=0,prev=-1;
    for(const i of si){const x=route[i];let a=x.a+off;if(a<prev){off+=86400;a+=86400}let dd=x.d+off;if(dd<a){off+=86400;dd+=86400}x.a=a;x.d=dd;prev=dd}
    out.push({dir,ty:+r.Syubetsu||0,name:[r.Ressyabangou,r.Ressyamei].filter(Boolean).join(' '),route,si,fs:stp[0],ls:stp[stp.length-1],t0:route[si[0]].a,t1:route[si[si.length-1]].d,id:out.length});
  }
  return out;
}

function useDia(i,first){
  const d=M.dias[i];M.cur=i;if(!d.trains)d.trains=build(d);cur=d.trains;selIds=new Set();
  const lo=Math.floor(Math.min(...cur.map(t=>t.t0))/900)*900,hi=Math.ceil(Math.max(...cur.map(t=>t.t1))/900)*900;
  M.lo=isFinite(lo)?lo:0;M.hi=isFinite(hi)?hi:86400;
    if(first||T<M.lo||T>M.hi){const now=new Date();const n=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();T=(n>=M.lo&&n<=M.hi)?n:M.lo}
  drawStops();draw();
}

const P=s=>{const p=M.pos[s];return{x:X(p.lane),y:Y(p.row)}};
// 分岐側の駅(コピー)は本線の駅と同じ位置
const pp=P;
const poly=nodes=>nodes.map(z=>pp(z.s));
// 本線と分岐線をまたぐ区間は、縦方向の距離だけ進み、区間の半分(2/4)を過ぎたところで分岐先の線路へワープする
function along(pts,f,q){const ls=[];let L=0;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],l=a.x!==b.x?Math.abs(b.y-a.y):Math.hypot(b.x-a.x,b.y-a.y);ls.push(l);L+=l}
  if(!L)return q<3?pts[0]:pts[pts.length-1];let t=f*L;
  for(let i=0;i<ls.length;i++){if(ls[i]>0&&t<=ls[i]){const k=t/ls[i],a=pts[i],b=pts[i+1];return{x:a.x!==b.x?(k<.5?a.x:b.x):a.x,y:a.y+(b.y-a.y)*k}}t-=ls[i]}
  return pts[pts.length-1]}
// 駅間を4分割し、区間ごとに段階的に進む。出発直後と到着直前は、その駅に別の番線の列車がいる場合だけ番線側へ寄る
function where(tr,t){
  if(t<tr.t0||t>tr.t1)return null;const R=tr.route,si=tr.si;
  for(let k=0;k<si.length;k++){const x=R[si[k]];
    if(t>=x.a&&t<=x.d){if(!x.ps)return{p:pp(x.s),at:x.s,tk:x.tk,k,sp:pp(x.s),stk:x.tk,ss:x.s,ta:x.a};
      const nx=R[si[k+1]];return{p:pp(x.s),from:x.s,next:nx?nx.s:x.s,k,q:1,sp:null}}
    if(k+1<si.length){const y=R[si[k+1]];
      if(t>x.d&&t<y.a){const q=Math.min(3,4*(t-x.d)/(y.a-x.d)|0);
        return{p:along(poly(R.slice(si[k],si[k+1]+1)),(q+.5)/4,q),from:x.s,next:y.s,k,q,sp:q===0&&!x.ps?pp(x.s):q===3&&!y.ps?pp(y.s):null,stk:q===0?x.tk:y.tk,ss:q===0?x.s:y.s,ta:q===0?x.a:y.a}}}}
  return null;
}

const ink=c=>{if(c[0]!=='#')return'var(--panel)';const v=parseInt(c.slice(1),16),r=v>>16,g=v>>8&255,b=v&255;return(r*299+g*587+b*114)/1000>150?'#111':'#fff'};
// 各駅に停車する種別(ダイヤごと)
function stopMap(d){const m=new Map();for(const tr of d.trains)for(const j of tr.si){if(tr.route[j].ps)continue;const k=pk(tr.route[j].s);if(!m.has(k))m.set(k,new Set());m.get(k).add(tr.ty)}return m}
const stops=()=>{const d=M.dias[M.cur];return d.stops||(d.stops=stopMap(d))};
function drawStops(){let h='';const m=stops();
  M.st.forEach((s,i)=>{const p=M.pos[i];if(p.copy)return;const x0=p.lane?X(p.lane)+82:12,y=Y(p.row)+5;
    [...(m.get(pk(i))||[])].filter(t=>!hidden.has(t)).sort((a,b)=>a-b).forEach((t,k)=>{const ty=M.types[t]||{col:'var(--mute)',ini:'?'},x=x0+k*19;
      h+=`<rect x="${x}" y="${y}" width="17" height="17" rx="4" fill="${ty.col}"/><text x="${x+8.5}" y="${y+13}" text-anchor="middle" font-size="11" font-weight="700" fill="${ink(ty.col)}">${ty.ini}</text>`})});
  $('#stp').innerHTML=h}
const tcol=tr=>(M.types[tr.ty]||{col:'var(--mute)'}).col;
const SHAPES=[['std','標準'],['pan','形A'],['rnd','形B']];
let shape='std';try{const v=localStorage.getItem('shape');if(SHAPES.some(x=>x[0]===v))shape=v}catch(e){}
// 列車アイコンの形。pan=パンタグラフ付き、rnd=丸みのある四角+足
function shapeSvg(k,c,tc,ini){
  const t=y=>ini?`<text y="${y}" text-anchor="middle" font-size="14" font-weight="700" fill="${tc}">${ini}</text>`:'';
  if(k==='pan')return `<g transform="scale(.9)"><path d="M-9-17H9M-8.5-17v3M8.5-17v3M-4-16v5M4-16v5" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/><path d="M-7-12H7Q10-8 10-2V8Q10 14 6 14H-6Q-10 14-10 8V-2Q-10-8-7-12Z" fill="${c}"/><path d="M-6 14v3.5M6 14v3.5" stroke="${c}" stroke-width="3"/>${t(5)}</g>`;
  if(k==='rnd')return `<g transform="scale(.9)"><path d="M-6-15H6Q11-15 11-8V9Q11 14 7 14H-7Q-11 14-11 9V-8Q-11-15-6-15Z" fill="${c}"/><path d="M-6.5 14v3.5M6.5 14v3.5" stroke="${c}" stroke-width="3"/>${t(4.5)}</g>`;
  return `<rect x="-12" y="-13" width="24" height="26" rx="8" fill="${c}"/>${ini?`<text y="5.5" text-anchor="middle" font-size="15" font-weight="700" fill="${tc}">${ini}</text>`:''}`;
}
function icon(g){
  const tr=g.trs[0],c=tcol(tr),up=g.side<0,sel=g.trs.some(t=>selIds.has(t.id)),n=g.trs.length;
  const tri=up?'M0-25L7-16H-7Z':'M0 25L7 16H-7Z';
  const lab=n>1?`+${n-1}`:'',ini=(M.types[tr.ty]||{}).ini||'';
  return `<g data-ids="${g.trs.map(t=>t.id)}" transform="translate(${g.x} ${g.y})" style="cursor:pointer"><rect x="-18" y="-28" width="36" height="${lab?64:56}" fill="transparent"/>${sel?`<rect x="-15" y="-18" width="30" height="36" rx="11" fill="none" stroke="${c}" stroke-width="2.5"/>`:''}${shapeSvg(shape,c,ink(c),ini)}<path d="${tri}" fill="${c}"/>${lab?`<text y="${up?31:42}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${lab}</text>`:''}</g>`;
}
function draw(){
  if(!M)return;
  const cnt=M.types.map(()=>0),stopped=new Map(),moving=[],items=[],slots=new Map();
  for(const tr of cur){const w=where(tr,T);if(!w)continue;cnt[tr.ty]=(cnt[tr.ty]||0)+1;if(hidden.has(tr.ty))continue;
    const side=tr.dir?-1:1;items.push({tr,w,side});
    if(w.sp){const k=w.sp.x+'_'+w.sp.y+'_'+side;if(!slots.has(k))slots.set(k,[]);slots.get(k).push([w.ta,tr.id])}}
  // 駅ごとに、先に着いていた列車ほど線の近く、あとから来た列車ほど外側に入る(番線が決まっていても同じ)。1本だけならまっすぐのまま
  const order=new Map();
  for(const [k,a] of slots)order.set(k,a.sort((p,q)=>p[0]-q[0]||p[1]-q[1]).map(z=>z[1]));
  for(const {tr,w,side} of items){
    const lst=w.sp?order.get(w.sp.x+'_'+w.sp.y+'_'+side):null,ox=lst?26+34*lst.indexOf(tr.id):26,x=w.p.x+side*ox,y=w.p.y;
    if(w.at!=null){const k=x+'_'+y;if(!stopped.has(k))stopped.set(k,{trs:[],x,y,side});stopped.get(k).trs.push(tr)}
    else moving.push({tr,x,y,side})}
  const groups=[...stopped.values()];
  moving.sort((a,b)=>a.x-b.x||a.y-b.y);
  let hd=null;
  for(const m of moving){if(hd&&hd.x===m.x&&m.y-hd.y<40)hd.trs.push(m.tr);else{hd={x:m.x,y:m.y,side:m.side,trs:[m.tr]};groups.push(hd)}}
  const html=groups.map(icon).join('');if(html!==lastHtml){$('#trains').innerHTML=html;lastHtml=html}
  const ti=$('#tin');if(document.activeElement!==ti)ti.value=fmt(T,true);
  info();
}
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pk=i=>M.pos[i].lane+'_'+M.pos[i].row,S=i=>esc(M.st[i].name);
let sh=null,ttDir=0;
const statusOf=tr=>{const w=where(tr,T);return w?(w.at!=null?`${M.st[w.at].name} に停車中`:`${M.st[w.from].name} → ${M.st[w.next].name} 走行中`):(T<tr.t0?'運転前':'運転終了')};
function openSheet(o){sh=o;$('#sheet').classList.remove('hide');renderSheet()}
function closeSheet(){sh=null;selIds=new Set();$('#sheet').classList.add('hide');draw()}
function renderSheet(){
  if(sh.type==='set'){renderSet();return}
  if(sh.type==='tr'){
    const trs=sh.ids.map(i=>cur[i]),tr=trs[sh.act],R=tr.route,ty=M.types[tr.ty]||{name:'',col:'var(--ink)'},a=R[tr.fs],b=R[tr.ls];
    const rows=[];tr.si.forEach((i,k)=>{const x=R[i],l=rows[rows.length-1];if(l&&!l.ps&&!x.ps&&pk(l.s)===pk(x.s)){l.d=x.d;l.b=k}else rows.push({s:x.s,a:x.a,d:x.d,ps:x.ps,ka:k,b:k})});
    $('#sh').innerHTML=`<div><div><b style="color:${ty.col}">${esc(ty.name)}</b> ${esc(tr.name)} ${tr.dir?'上り':'下り'}</div><div class="mute">${S(a.s)} ${fmt(a.d)} → ${S(b.s)} ${fmt(b.a)}</div><div id="sst"></div>${trs.length>1?'<div class="tabs">'+trs.map((t,i)=>`<button data-act="${i}" ${i===sh.act?'style="border-color:var(--acc)"':''}>${esc((M.types[t.ty]||{}).name)} ${esc(t.name)||fmt(t.t0)}</button>`).join('')+'</div>':''}</div><button id="cls">閉じる</button>`;
    $('#sb').innerHTML=`<table><tr><th>駅</th><th>着</th><th>発</th></tr>${rows.map((r,i)=>r.ps?`<tr data-a="${r.ka}" data-b="${r.b}"><td class="mute">${S(r.s)}</td><td class="mute" colspan="2">通過 ${fmt(r.a)}</td></tr>`:`<tr data-a="${r.ka}" data-b="${r.b}"><td>${S(r.s)}</td><td>${i?fmt(r.a):''}</td><td>${i<rows.length-1?fmt(r.d):''}</td></tr>`).join('')}</table>`;
    markRows();
  }else{
    const i=sh.i,key=pk(i),L=[];
    for(const tr of cur){if(hideTT.has(tr.ty)||tr.dir!==ttDir)continue;const R=tr.route,ks=tr.si.filter(j=>!R[j].ps&&pk(R[j].s)===key);if(!ks.length)continue;const last=ks[ks.length-1]===tr.ls;
      L.push({t:last?R[ks[0]].a:R[ks[ks.length-1]].d,tr,last,dest:M.st[R[tr.ls].s].name})}
    L.sort((p,q)=>p.t-q.t);const hrs=[...new Set(L.map(x=>Math.floor(x.t/3600)))];
    const tset=[...(stops().get(key)||[])].filter(t=>!hideTT.has(t)).sort((a,b)=>a-b);
    $('#sh').innerHTML=`<div style="flex:1;min-width:0"><b style="font-size:18px">${S(i)}</b><div class="mute">${tset.length?'停車: '+tset.map(t=>{const ty=M.types[t]||{name:'',col:'var(--ink)'};return `<b style="color:${ty.col}">${esc(ty.name)}</b>`}).join(' '):'停車する列車なし'}</div><div class="seg" id="dirs" style="margin-top:8px;max-width:240px"><button data-dir="0" class="${ttDir?'':'on'}">下り</button><button data-dir="1" class="${ttDir?'on':''}">上り</button></div></div><button id="cls">閉じる</button>`;
    $('#sb').innerHTML=L.length?`<table>${hrs.map(h=>`<tr><td class="hr">${h%24}</td><td>${L.filter(x=>Math.floor(x.t/3600)===h).map(x=>`<span class="m" style="color:${(M.types[x.tr.ty]||{col:'var(--ink)'}).col}"><b>${String(Math.floor(x.t%3600/60)).padStart(2,'0')}</b><small>${x.last?'当駅止':esc(x.dest)+'行'}</small></span>`).join('')}</td></tr>`).join('')}</table>`:'<div class="mute" style="padding:12px 0">この方面に停車する列車はありません</div>';
  }
}
function markRows(){
  if(!sh||sh.type!=='tr')return;const tr=cur[sh.ids[sh.act]],w=where(tr,T);
  const e=$('#sst');if(e)e.innerHTML=`<span class="mute">${esc(statusOf(tr))}</span>`;
  document.querySelectorAll('#sb tr[data-a]').forEach(r=>{const a=+r.dataset.a,b=+r.dataset.b;let c='';
    if(w){const k=w.k;if(w.at!=null){c=(a<=k&&k<=b)?'now':(b<k?'past':'')}else{c=(a<=k&&k+1<=b)?'now':(b<=k?'past':((a<=k+1&&k+1<=b)?'next':''))}}else if(T>tr.t1)c='past';
    r.className=c});
}
function info(){markRows()}
$('#sheet').addEventListener('click',e=>{if(e.target.closest('#cls'))closeSheet();const dd=e.target.closest('[data-dir]');if(dd&&sh&&sh.type==='st'){ttDir=+dd.dataset.dir;renderSheet();$('#sb').scrollTop=0}const t=e.target.closest('[data-act]');if(t){sh.act=+t.dataset.act;selIds=new Set([sh.ids[sh.act]]);renderSheet();draw()}});
const LCS=['#5a9e35','#d98c00','#2f8fd0','#a14fb8','#d6453d','#14919b'];
let lcCur='';try{lcCur=localStorage.getItem('lc')||''}catch(e){}
function applyLc(){const r=document.documentElement;lcCur?r.style.setProperty('--lc',lcCur):r.style.removeProperty('--lc')}
function setLc(c){lcCur=c;applyLc();try{c?localStorage.setItem('lc',c):localStorage.removeItem('lc')}catch(e){}}
applyLc();
function renderSet(){
  $('#sh').innerHTML='<div><b style="font-size:17px">設定</b></div><button id="cls">閉じる</button>';
  const ty=M?M.types:[];
  $('#sb').innerHTML=`<h3>路線の色</h3><div class="row" id="lcs">${['',...LCS].map(c=>`<button class="sw${c===lcCur?' on':''}" data-c="${c}" style="background:${c||'conic-gradient(#5a9e35 50%,#78b552 0)'}" aria-label="${c||'標準'}"></button>`).join('')}<input type="color" id="lcc" value="${/^#[0-9a-f]{6}$/i.test(lcCur)?lcCur:'#5a9e35'}" aria-label="好きな色"></div>
  <h3>列車の形</h3><div class="seg" id="shp" role="group" aria-label="列車の形">${SHAPES.map(([k,n])=>`<button data-shape="${k}" class="${k===shape?'on':''}"><svg viewBox="-15 -19 30 38">${shapeSvg(k,'currentColor','var(--accf)','')}</svg>${n}</button>`).join('')}</div>
  <h3>種別(凡例)</h3>`+(ty.length?`<table><tr><th>種別</th><th>在線</th><th>時刻表</th></tr>${ty.map((t,i)=>`<tr><td><span class="ic" style="background:${t.col};color:${ink(t.col)}">${esc(t.ini)}</span> ${esc(t.name)}</td><td><input type="checkbox" data-k="map" data-t="${i}" aria-label="${esc(t.name)}を在線に表示" ${hidden.has(i)?'':'checked'}></td><td><input type="checkbox" data-k="tt" data-t="${i}" aria-label="${esc(t.name)}を時刻表に表示" ${hideTT.has(i)?'':'checked'}></td></tr>`).join('')}</table><div class="mute" style="margin-top:8px;font-size:12px">在線: 路線図の列車と、駅名の下の停車種別 / 時刻表: 駅をタップしたときの時刻表</div>`:'<div class="mute">ファイルを読み込むと種別が表示されます</div>');
}
$('#gear').onclick=()=>openSheet({type:'set'});
$('#sheet').addEventListener('click',e=>{const sp=e.target.closest('[data-shape]');if(sp&&sh&&sh.type==='set'){shape=sp.dataset.shape;try{localStorage.setItem('shape',shape)}catch(e){}document.querySelectorAll('#sb [data-shape]').forEach(x=>x.classList.toggle('on',x===sp));lastHtml=null;draw()}const b=e.target.closest('.sw');if(b&&sh&&sh.type==='set'){setLc(b.dataset.c);document.querySelectorAll('#sb .sw').forEach(x=>x.classList.toggle('on',x===b))}});
$('#sheet').addEventListener('input',e=>{if(e.target.id==='lcc'){setLc(e.target.value);document.querySelectorAll('#sb .sw').forEach(x=>x.classList.remove('on'))}});
$('#sheet').addEventListener('change',e=>{const c=e.target.closest('[data-k]');if(!c)return;const t=+c.dataset.t,set=c.dataset.k==='map'?hidden:hideTT;c.checked?set.delete(t):set.add(t);if(c.dataset.k==='map'){drawStops();lastHtml=null;draw()}});
$('#thm').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('thm',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('thm');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}

function loadFile(f){
  const rd=new FileReader();
  rd.onload=()=>{let t;const u=new Uint8Array(rd.result);
    try{t=new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){t=new TextDecoder('shift_jis').decode(u)}
    t=t.replace(/^\uFEFF/,'').replace(/\r/g,'');
    try{const root=parseOud(t);if(!root.Rosen)throw new Error('Rosen');setup(root,f.name.replace(/\.[^.]+$/,''))}
    catch(e){alert('このファイルは読み込めませんでした。OuDiaSecond形式(.oud2)のファイルを選んでください。')}};
  rd.readAsArrayBuffer(f);
}
$('#file').onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);
addEventListener('dragover',e=>{e.preventDefault();$('#drop').classList.add('over')});
addEventListener('dragleave',()=>$('#drop').classList.remove('over'));
addEventListener('drop',e=>{e.preventDefault();$('#drop').classList.remove('over');e.dataTransfer.files[0]&&loadFile(e.dataTransfer.files[0])});
$('#dia').onchange=e=>useDia(+e.target.value);
const ICON_PAUSE='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg>',ICON_PLAY='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>';
function setPlay(on){playing=on;$('#play').innerHTML=on?ICON_PAUSE:ICON_PLAY}
$('#play').onclick=()=>setPlay(!playing);
$('#tin').onchange=e=>{const m=e.target.value.match(/^(\d+):(\d+)(?::(\d+))?$/);if(!m||!M)return;let t=+m[1]*3600+ +m[2]*60+(+m[3]||0);if(t<M.lo&&t+86400<=M.hi)t+=86400;T=Math.min(Math.max(t,M.lo),M.hi);e.target.blur();draw()};
function setSpeed(v){speed=v;document.querySelectorAll('#spd button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v))}
$('#spd').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)setSpeed(+b.dataset.v)});
$('#now').onclick=()=>{const n=new Date();T=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();setSpeed(1);setPlay(true);if(M&&(T<M.lo||T>M.hi))T=M.lo;draw()};
let pd=null;
$('#map').addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY}});
$('#map').addEventListener('pointerup',e=>{if(!pd)return;const mv=Math.hypot(e.clientX-pd.x,e.clientY-pd.y);pd=null;if(mv>10)return;
  const t=document.elementFromPoint(e.clientX,e.clientY),g=t&&t.closest('[data-ids]');
  if(g){const ids=g.dataset.ids.split(',').map(Number);selIds=new Set([ids[0]]);lastHtml=null;openSheet({type:'tr',ids,act:0});draw();return}
  const q=t&&t.closest('[data-st]');if(q){selIds=new Set();lastHtml=null;openSheet({type:'st',i:+q.dataset.st});draw()}});
setInterval(()=>{if(M&&playing){T+=.25*speed;if(T>M.hi)T=M.lo;draw()}},250);
</script>
